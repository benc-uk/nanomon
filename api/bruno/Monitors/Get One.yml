info:
  name: Get One
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiEndpoint}}/api/monitors/{{monitorId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{monitorId}}"
    - expression: res.body.name
      operator: isNotEmpty
    - expression: res.body
      operator: isJson

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieves a single monitor by its ID, returning the monitor's details in JSON format.
