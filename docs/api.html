<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoMon API Service - API Documentation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #opencollection-container {
        width: 100vw;
        height: 100vh;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.opencollection.com/docs.css" />
    <script src="https://cdn.opencollection.com/docs.js"></script>
  </head>
  <body>
    <div id="opencollection-container"></div>
    <script>
      const collectionData =
        'opencollection: 1.0.0\ninfo:\n  name: NanoMon API Service\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: \'\'\n      port: \'\'\n      auth:\n        username: \'\'\n        password: \'\'\n      bypassProxy: \'\'\n  environments:\n    - name: local-dev\n      variables:\n        - name: apiEndpoint\n          value: http://localhost:8000\nitems:\n  - info:\n      name: Monitors\n      type: folder\n      seq: 1\n    request:\n      auth: inherit\n    docs:\n      content: API endpoints for managing monitors, including creating, updating, deleting, and importing monitor configurations.\n      type: text/markdown\n    items:\n      - info:\n          name: Update One\n          type: http\n          seq: 4\n        http:\n          method: PUT\n          url: \'{{apiEndpoint}}/api/monitors/{{monitorId}}\'\n          body:\n            type: json\n            data: |-\n              {\n                "name": "Updated {{$randomDomainWord}}",\n                "type": "http",\n                "interval": "500s",\n                "target": "https://example.net",\n                "properties": {\n                  "thingy": "foo"\n                },\n                "enabled": false\n              }\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'200\'\n            - expression: res.body.id\n              operator: eq\n              value: \'{{monitorId}}\'\n            - expression: res.body.name\n              operator: isNotEmpty\n              value: \'\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Updates an existing monitor with the specified ID, allowing changes to its configuration. Returns the updated monitor details in JSON format.\n      - info:\n          name: Get One\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: \'{{apiEndpoint}}/api/monitors/{{monitorId}}\'\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'200\'\n            - expression: res.body.id\n              operator: eq\n              value: \'{{monitorId}}\'\n            - expression: res.body.name\n              operator: isNotEmpty\n              value: \'\'\n            - expression: res.body\n              operator: isJson\n              value: \'\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Retrieves a single monitor by its ID, returning the monitor\'s details in JSON format.\n      - info:\n          name: Delete All\n          type: http\n          seq: 8\n        http:\n          method: DELETE\n          url: \'{{apiEndpoint}}/api/monitors\'\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'204\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Deletes all configuration for all monitors, beware!\n      - info:\n          name: Delete One\n          type: http\n          seq: 5\n        http:\n          method: DELETE\n          url: \'{{apiEndpoint}}/api/monitors/{{monitorId}}\'\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'204\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Deletes a single monitor with the specified ID\n      - info:\n          name: List All\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: \'{{apiEndpoint}}/api/monitors\'\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'200\'\n            - expression: res.body\n              operator: isArray\n              value: \'\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Retrieves a list of all monitors, returning an array of monitor objects in JSON format.\n      - info:\n          name: Create\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: \'{{apiEndpoint}}/api/monitors\'\n          body:\n            type: json\n            data: |-\n              {\n                "name": "Bruno Test {{$randomDomainWord}}",\n                "type": "http",\n                "interval": "60s",\n                "target": "https://example.net",\n                "properties": {\n                  "timeout": "10s"\n                },\n                "enabled": true\n              }\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.body.id\n              operator: isNumber\n              value: \'\'\n            - expression: res.status\n              operator: eq\n              value: \'200\'\n          actions:\n            - type: set-variable\n              phase: after-response\n              selector:\n                expression: res.body.id\n                method: jsonq\n              variable:\n                name: monitorId\n                scope: runtime\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Create a new HTTP monitor with some simple example parameters\n      - info:\n          name: Get Results\n          type: http\n          seq: 6\n        http:\n          method: GET\n          url: \'{{apiEndpoint}}/api/monitors/{{monitorId}}/results\'\n          params:\n            - name: max\n              value: \'\'\n              type: query\n              disabled: true\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'200\'\n            - expression: res.body\n              operator: isArray\n              value: \'\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Retrieves the results for a specific monitor, returning an array of result objects in JSON format. Optional query parameter \'max\' can be used to limit the number of results returned.\n      - info:\n          name: Import\n          type: http\n          seq: 7\n        http:\n          method: POST\n          url: \'{{apiEndpoint}}/api/monitors/import\'\n          body:\n            type: json\n            data: |-\n              [\n                {\n                  "name": "Bruno Test Health {{$randomDomainWord}}",\n                  "type": "http",\n                  "interval": "20s",\n                  "target": "http://localhost:8000/api/health",\n                  "enabled": true\n                },\n                {\n                  "name": "Bruno Test Status {{$randomDomainWord}}",\n                  "type": "http",\n                  "interval": "5s",\n                  "target": "http://localhost:8000/api/status",\n                  "enabled": true\n                }\n              ]\n          auth: inherit\n        runtime:\n          assertions:\n            - expression: res.status\n              operator: eq\n              value: \'204\'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Import configuration for multiple monitors in bulk\n  - info:\n      name: Results\n      type: folder\n      seq: 2\n    docs:\n      content: API endpoints for retrieving monitor results\n      type: text/markdown\n    items:\n      - info:\n          name: Delete All\n          type: http\n          seq: 2\n        http:\n          method: DELETE\n          url: \'{{apiEndpoint}}/api/results\'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Deletes all results for all monitors from the system, beware! This action is irreversible and will permanently remove all historical monitoring data.\n      - info:\n          name: Get All\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: \'{{apiEndpoint}}/api/results\'\n          params:\n            - name: max\n              value: \'150\'\n              type: query\n              disabled: true\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Retrieves a list of all results for all monitors, returning an array of result objects in JSON format. Optional query parameter \'max\' can be used to limit the number of results returned.\ndocs:\n  content: |\n    # A Bruno collection for calling the Nanomon API.\n\n    The collection is organized by the main endpoints of the API, with sample requests for each endpoint. This is in the new YAML based OpenCollection format https://www.opencollection.com/\n\n    In order to use this file, install the Bruno app https://www.usebruno.com/\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    presets:\n      requestType: http\n      requestUrl: http://{{apiEndpoint}}/api\n    exportedAt: \'2026-02-07T12:13:43.337Z\'\n    exportedUsing: Bruno/3.0.2\n';
      new window.OpenCollection({
        target: document.getElementById("opencollection-container"),
        opencollection: collectionData,
        theme: "dark",
      });
    </script>
  </body>
</html>
